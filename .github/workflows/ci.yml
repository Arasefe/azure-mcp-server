# CI for the azsec-mcp server. Static gates only: the server authenticates to Cavalry77 with a
# service-principal certificate (cavalry-sp.combined.pem) and .env, both gitignored, so CI never
# holds Azure credentials and never calls Azure. Every test mocks Azure with respx.
#
# Every third-party action is pinned to a full commit SHA and every image to an exact version;
# the token is read-only.
name: ci
on:
  push:
    branches: [main, python-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  # Locked install, lint, format, types and the full test suite
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q

  # Fail on a known HIGH/CRITICAL vulnerability in the locked dependency tree (reads uv.lock)
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy dependency scan (fail on HIGH/CRITICAL)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/src" aquasec/trivy:0.76.0
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src

  # Catch a committed certificate, key or .env anywhere in history
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # required for gitleaks to scan the full history
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # token is read-only, so no PR comments

  # SAST: fail on any blocking Semgrep finding
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config auto --error .
